//渲染题目
function renderQuestion(){
    const q = qData[currentQIndex];
    document.getElementById("q-title").innerText = q.q;
    const optWrap = document.getElementById("option-wrap");
    optWrap.innerHTML = "";
    q.opts.forEach(opt=>{
        const btn = document.createElement("button");
        btn.className = "opt-btn";
        btn.innerText = opt.txt;
        btn.onclick = ()=>{
            score.life += opt.score[0];
            score.favor += opt.score[1];
            score.fame += opt.score[2];
            score.calc += opt.score[3];
            currentQIndex++;
            if(currentQIndex >= qData.length){
                renderResult();
                switchPage("page-result");
            }else{
                renderQuestion();
            }
        }
        optWrap.appendChild(btn);
    })
}

//结局判定逻辑
function renderResult(){
    document.getElementById("score-life").innerText = score.life;
    document.getElementById("score-favor").innerText = score.favor;
    document.getElementById("score-fame").innerText = score.fame;
    document.getElementById("score-calc").innerText = score.calc;
    const descBox = document.getElementById("result-desc");
    let resultText = getResultText(score);
    descBox.innerHTML = resultText;
}
